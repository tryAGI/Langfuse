name: Publish
on:
  push:
    branches:
      - main
    tags:
      - v**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    needs: migration-contracts
    uses: tryAGI/workflows/.github/workflows/generated-sdk-publish.yml@main
    with:
      auto-stable-release: true
      project-path: src/libs/Langfuse/Langfuse.csproj
      dotnet-version: 10.0.x
      enable-caching: false
      additional-test-arguments: '--logger GitHubActions'

  migration-contracts:
    name: Migration contracts and NativeAOT
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Check migration guard
        run: python3 -m unittest discover -s scripts/tests
      - name: Publish replacement API contract executable
        run: dotnet publish src/tests/NativeAot/Langfuse.NativeAot.csproj -c Release -r linux-x64 -o artifacts/native-contracts
      - name: Execute replacement API contracts without provider access
        run: ./artifacts/native-contracts/Langfuse.NativeAot

  # Fails in seconds when the nuget.org trusted-publishing policy is missing or no longer matches, rather
  # than letting the whole build run and surfacing the mismatch as an HTTP 401 at the push. It declares no
  # `needs`, so it runs beside the build instead of after it, and it has to stay in this workflow for the
  # same reason the push does: nuget.org matches the policy against job_workflow_ref.
  nuget-trusted-publish-check:
    name: Check NuGet trusted publishing
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tryAGI/workflows/.github/actions/nuget-trusted-publish-check@main
        with:
          user: havendv

  nuget-trusted-publish:
    name: NuGet trusted publishing
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tryAGI/workflows/.github/actions/nuget-publish@main
        with:
          user: havendv
